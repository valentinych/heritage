{% extends "base.html" %}
{% block title %}Регистрация — Наследие{% endblock %}
{% block body_attrs %} class="layout-login"{% endblock %}
{% block header %}{% endblock %}
{% block body %}
<h1>Регистрация</h1>
{% if error %}
<p id="register-error" class="flash flash-error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/register" class="stack">
  <label class="field">Имя
    <input name="username" value="{{ username }}" autocomplete="username" required maxlength="64" {% if error %}aria-invalid="true" aria-describedby="register-error"{% endif %} autofocus>
  </label>
  <label class="field">Пароль
    <input type="password" name="password" autocomplete="new-password" required minlength="8" {% if error %}aria-invalid="true" aria-describedby="register-error"{% endif %}>
  </label>
  <button class="button-primary" type="submit">Зарегистрироваться</button>
</form>
<p><a href="/login">Вход</a></p>
{% endblock %}
